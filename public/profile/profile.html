<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="version" content="3.1-fixed">
    <title>Профиль пользователя v3.1 - Fixed</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <button id="testSaveButton" class="test-button">💾 Сохранить изменения</button>

    <script>
        // --- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ---
        const API_URL = 'https://rdf-rocky-bot-twa.vercel.app';
        let tg = null;
        let saveCallback = null;

        // --- ДИАГНОСТИКА TELEGRAM WEBAPP ---
        function diagnoseTelegramWebApp() {
            console.log('🔍 === ДИАГНОСТИКА TELEGRAM WEBAPP ===');
            
            // Проверяем window.Telegram
            console.log('window.Telegram exists:', !!window.Telegram);
            if (window.Telegram) {
                console.log('window.Telegram.WebApp exists:', !!window.Telegram.WebApp);
            }
            
            // Проверяем глобальную переменную tg
            console.log('Global tg variable:', tg);
            
            if (tg) {
                console.log('tg.initData exists:', !!tg.initData);
                console.log('tg.initData length:', tg.initData ? tg.initData.length : 0);
                console.log('tg.initDataUnsafe exists:', !!tg.initDataUnsafe);
                console.log('tg.initDataUnsafe:', tg.initDataUnsafe);
                console.log('tg.version:', tg.version);
                console.log('tg.platform:', tg.platform);
                console.log('tg.colorScheme:', tg.colorScheme);
                console.log('tg.isExpanded:', tg.isExpanded);
                console.log('tg.viewportHeight:', tg.viewportHeight);
                
                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    console.log('User data from tg.initDataUnsafe.user:', tg.initDataUnsafe.user);
                } else {
                    console.log('❌ NO USER DATA in tg.initDataUnsafe');
                }
            }
            
            // Проверяем User Agent
            console.log('User Agent:', navigator.userAgent);
            
            // Проверяем, запущено ли в Telegram
            const isTelegramApp = navigator.userAgent.includes('Telegram');
            console.log('Running in Telegram app:', isTelegramApp);
            
            console.log('🔍 === КОНЕЦ ДИАГНОСТИКИ ===');
        }

        // --- ИНИЦИАЛИЗАЦИЯ ---
        function initializeTelegram() {
            console.log('🚀 Initializing Telegram WebApp...');
            
            // Проверяем доступность Telegram WebApp
            if (window.Telegram && window.Telegram.WebApp) {
                tg = window.Telegram.WebApp;
                console.log('✅ Telegram WebApp available');
                
                // Запускаем диагностику
                diagnoseTelegramWebApp();
                
                tg.ready();
                tg.expand();
                
                // Настраиваем MainButton
                tg.MainButton.setText('💾 Сохранить изменения');
                tg.MainButton.show();
                
                return true;
            } else {
                console.log('⚠️ Telegram WebApp not available, using fallback');
                
                // Все равно запускаем диагностику
                diagnoseTelegramWebApp();
                
                // Показываем тестовую кнопку для отладки
                const testButton = document.getElementById('testSaveButton');
                testButton.style.display = 'block';
                testButton.onclick = () => {
                    if (saveCallback) saveCallback();
                };
                
                return false;
            }
        }

        // --- API ФУНКЦИИ ---
        async function loadUserProfile(chatId) {
            // ВРЕМЕННО: Всегда используем реальный API (без проверки initData)
            // const TEST_MODE = !tg || !tg.initData;
            const TEST_MODE = false; // Принудительно отключаем тестовый режим
            
            if (TEST_MODE) {
                console.log('🧪 TEST MODE: returning mock data');
                return new Promise(resolve => {
                    setTimeout(() => {
                        resolve({
                            success: true,
                            user: {
                                chat_id: 182719187,
                                first_name: "Egor",
                                last_name: "Nikitin",
                                username: "urso_barbudos",
                                phone: "+7 (999) 123-45-67",
                                payment_info: "4111 1111 1111 1111\nСбербанк\nЕгор Никитин",
                                notes: "Тестовые заметки о предпочтениях."
                            }
                        });
                    }, 1000);
                });
            }

            const url = `${API_URL}/api/profile?chat_id=${chatId}`;

            try {
                const headers = {
                    'Cache-Control': 'no-cache'
                };
                
                // Добавляем initData только если он существует
                if (tg && tg.initData) {
                    headers['X-Telegram-Init-Data'] = tg.initData;
                }
                
                const response = await fetch(url, {
                    headers: headers
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    
                    if (response.status === 404 && errorData.redirect === 'registration') {
                        window.location.href = '../registration/registration.html';
                        return;
                    }
                    
                    throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                return data || {};
            } catch (error) {
                console.error("Error loading user profile:", error);
                throw error;
            }
        }

        async function saveUserProfile(chatId, userData) {
            // ВРЕМЕННО: Всегда используем реальный API
            // const TEST_MODE = !tg || !tg.initData;
            const TEST_MODE = false; // Принудительно отключаем тестовый режим
            
            if (TEST_MODE) {
                console.log('🧪 TEST MODE: simulating save');
                return new Promise(resolve => {
                    setTimeout(() => {
                        resolve({ success: true, message: "Profile saved successfully (TEST)" });
                    }, 1000);
                });
            }

            const url = `${API_URL}/api/profile`;

            try {
                const headers = { 
                    'Content-Type': 'application/json'
                };
                
                // Добавляем initData только если он существует
                if (tg && tg.initData) {
                    headers['X-Telegram-Init-Data'] = tg.initData;
                }
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify({
                        chat_id: chatId,
                        payment_info: userData.payment_info,
                        notes: userData.notes
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
                }
                
                return await response.json();
            } catch (error) {
                console.error("Error saving user profile:", error);
                throw error;
            }
        }

        // --- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ---
        function populateUserData(user, profileData = null) {
            // Обновляем заголовок с именем пользователя
            const userName = `${user.first_name || ''} ${user.last_name || ''}`.trim() || 'Пользователь';
            let displayUsername = user.username || 'Не указан';
            if (displayUsername !== 'Не указан') {
                displayUsername = displayUsername.trim();
                if (!displayUsername.startsWith('@')) {
                    displayUsername = '@' + displayUsername;
                }
            }
            document.getElementById('userSummary').innerHTML = `${userName}<br>${displayUsername}`;
            
            // Заполняем поля информации
            document.getElementById('username').textContent = displayUsername;
            document.getElementById('phone').textContent = profileData?.phone || 'Не указан';

            // Заполняем редактируемые поля если есть данные профиля
            if (profileData) {
                document.getElementById('payment').value = profileData.payment_info || '';
                document.getElementById('notes').value = profileData.notes || '';
            }
        }

        // --- ЛОГИКА СТРАНИЦЫ ---
        document.addEventListener('DOMContentLoaded', async () => {
            // Правильная инициализация Telegram WebApp
            console.log('📱 DOMContentLoaded - начинаем инициализацию...');
            
            // Вызываем нашу функцию инициализации
            const telegramAvailable = initializeTelegram();

            // Инициализация элементов после загрузки DOM
            const form = document.getElementById('profileForm');
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');

            // UI функции
            function showLoading(show) {
                loadingEl.style.display = show ? 'flex' : 'none';
                form.style.display = show ? 'none' : 'block';
            }

            function showError(message) {
                if (message) {
                    errorEl.textContent = message;
                    errorEl.style.display = 'block';
                } else {
                    errorEl.style.display = 'none';
                }
            }

            // Получаем данные пользователя с подробной диагностикой
            let user = null;
            let userId = null;
            
            console.log('🔍 Определяем пользователя...');
            
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                // Реальные данные из Telegram
                user = tg.initDataUnsafe.user;
                userId = user.id;
                console.log('✅ Пользователь из Telegram WebApp:', user);
            } else {
                // Проверяем, не localhost ли это (для разработки)
                const isDevelopment = window.location.hostname === 'localhost' || 
                                    window.location.hostname === '127.0.0.1' ||
                                    window.location.protocol === 'file:';
                
                if (isDevelopment) {
                    // ТОЛЬКО для разработки на localhost
                    console.log('🔧 РЕЖИМ РАЗРАБОТКИ: используем тестового пользователя');
                    userId = 182719187;
                    user = {
                        id: userId,
                        first_name: "Егор",
                        last_name: "Никитин", 
                        username: "urso_barbudos"
                    };
                    showError('🔧 Режим разработки (только localhost)');
                } else {
                    // БЕЗОПАСНОСТЬ: Блокируем доступ на production
                    console.error('❌ ДОСТУП ЗАБЛОКИРОВАН: Нет данных пользователя из Telegram');
                
                showError('🚫 Доступ запрещен: Приложение должно быть открыто через Telegram бот');
                showLoading(false);
                form.style.display = 'none';
                
                // Скрываем все элементы интерфейса
                document.getElementById('userSummary').innerHTML = '🚫 Неавторизованный доступ';
                
                // Показываем инструкцию
                const instructionDiv = document.createElement('div');
                instructionDiv.innerHTML = `
                    <div style="text-align: center; padding: 20px; color: #ff4757;">
                        <h3>🤖 Доступ только через Telegram</h3>
                        <p>Это приложение работает только внутри Telegram.</p>
                        <p>Откройте бот <strong>@Rocky_RDF_Admin</strong> в Telegram и используйте Menu Button.</p>
                    </div>
                `;
                document.querySelector('.container').appendChild(instructionDiv);
                
                return; // Прерываем выполнение
                }
            }
            
            console.log('👤 Итоговые данные пользователя:', { user, userId });
            
            if (user) {
                // Обновляем заголовок с именем пользователя
                const userName = `${user.first_name || ''} ${user.last_name || ''}`.trim() || 'Пользователь';
                let displayUsername = user.username || 'Не указан';
                if (displayUsername !== 'Не указан') {
                    displayUsername = displayUsername.trim();
                    if (!displayUsername.startsWith('@')) {
                        displayUsername = '@' + displayUsername;
                    }
                }
                document.getElementById('userSummary').innerHTML = `${userName}<br>${displayUsername}`;
                
                // Заполняем поля информации
                document.getElementById('username').textContent = displayUsername;
                document.getElementById('phone').textContent = 'Не указан';
            }

            tg.MainButton.setText('💾 Сохранить изменения');
            tg.MainButton.show();

            showLoading(true);
            showError('');

            try {
                console.log('📡 Загружаем профиль для пользователя:', userId);
                const userProfileData = await loadUserProfile(userId);

                if (userProfileData && userProfileData.success && userProfileData.user) {
                    // Существующий пользователь с данными
                    const userData = userProfileData.user;
                    
                    // Отладочная информация
                    console.log('API Response:', userData);
                    
                    document.getElementById('payment').value = userData.payment_info || '';
                    document.getElementById('notes').value = userData.notes || '';
                    
                    // Обновляем отображение пользователя
                    // ID больше не отображается для пользователя
                    
                    // Исправляем отображение username - убираем двойные @@ и лишние пробелы
                    let displayUsername = userData.username || 'Не указан';
                    console.log('Original username from API:', JSON.stringify(userData.username));
                    if (displayUsername !== 'Не указан') {
                        // Убираем лишние пробелы и нормализуем
                        displayUsername = displayUsername.trim();
                        console.log('After trim:', JSON.stringify(displayUsername));
                        // Если уже есть @ в начале, используем как есть, иначе добавляем
                        if (!displayUsername.startsWith('@')) {
                            displayUsername = '@' + displayUsername;
                            console.log('Added @:', JSON.stringify(displayUsername));
                        } else {
                            console.log('Already starts with @:', JSON.stringify(displayUsername));
                        }
                    }
                    console.log('Final displayUsername:', JSON.stringify(displayUsername));
                    document.getElementById('username').textContent = displayUsername;
                    
                    // Обновляем заголовок с реальными данными
                    const userName = `${userData.first_name || ''} ${userData.last_name || ''}`.trim() || 'Пользователь';
                    document.getElementById('userSummary').innerHTML = `${userName}<br>${displayUsername}`;
                    
                    // Добавляем отображение новых полей
                    document.getElementById('firstName').textContent = userData.first_name || 'Не указано';
                    document.getElementById('lastName').textContent = userData.last_name || 'Не указано';
                    document.getElementById('phone').textContent = userData.phone || 'Не указан';
                }
                showLoading(false);
            } catch (error) {
                console.error(error);
                
                // Показываем сообщение об ошибке и скрываем форму
                const errorMessage = error.message || 'Не удалось загрузить данные профиля. Попробуйте позже.';
                showError(errorMessage);
                
                // Скрываем форму и кнопку при ошибке доступа
                loadingEl.style.display = 'none';
                form.style.display = 'none';
                tg.MainButton.hide();
            }
        });

        tg.MainButton.onClick(async () => {
            const form = document.getElementById('profileForm');
            const errorEl = document.getElementById('error');
            
            function showError(message) {
                if (message) {
                    errorEl.textContent = message;
                    errorEl.style.display = 'block';
                } else {
                    errorEl.style.display = 'none';
                }
            }

            tg.MainButton.showProgress();
            showError('');

            const userData = {
                payment_info: document.getElementById('payment').value,
                notes: document.getElementById('notes').value
            };

            try {
                const result = await saveUserProfile(tg.initDataUnsafe.user.id, userData);
                if (result && result.success) {
                    tg.showAlert('✅ Профиль успешно сохранен!', () => {
                        tg.close();
                    });
                } else {
                    throw new Error(result.message || "Save operation failed");
                }
            } catch (error) {
                console.error(error);
                showError('Не удалось сохранить данные. Попробуйте снова.');
            } finally {
                tg.MainButton.hideProgress();
            }
        });
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .user-summary {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
        }

        .widget {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        .widget h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }

        .hint {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            color: white;
            font-size: 18px;
        }

        .error {
            background: #ff4757;
            color: white;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .info-label {
            font-weight: 600;
            color: #666;
        }

        .info-value {
            color: #333;
        }

        /* Тестовая кнопка для отладки */
        .test-button {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👤 Профиль пользователя</h1>
            <div class="user-summary" id="userSummary">Загрузка...</div>
        </div>
        
        <div id="loading" class="loading">
            🔄 Загрузка данных профиля...
        </div>

        <div id="error" class="error"></div>
        
        <form id="profileForm" style="display: none;">
            <!-- Основная информация -->
            <div class="widget">
                <h3>� Основная информация</h3>
                <div class="info-row">
                    <span class="info-label">Username:</span>
                    <span class="info-value" id="username">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Телефон:</span>
                    <span class="info-value" id="phone">-</span>
                </div>
            </div>

            <!-- Редактируемые поля -->
            <div class="widget">
                <h3>💳 Платежные реквизиты</h3>
                <div class="form-group">
                    <label for="payment">Реквизиты для оплаты:</label>
                    <textarea 
                        id="payment" 
                        name="payment" 
                        rows="4" 
                        placeholder="Укажите номер карты, банк и ФИО держателя карты"
                    ></textarea>
                    <div class="hint">Укажите реквизиты для получения оплаты</div>
                </div>
            </div>

            <div class="widget">
                <h3>📝 Дополнительная информация</h3>
                <div class="form-group">
                    <label for="notes">Заметки:</label>
                    <textarea 
                        id="notes" 
                        name="notes" 
                        rows="4" 
                        placeholder="Дополнительная информация о предпочтениях, графике работы и т.д."
                    ></textarea>
                    <div class="hint">Любая дополнительная информация о вас</div>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
