<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Профиль пользователя v2.1</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // --- НАСТРОЙКИ API ---
        const API_URL = 'https://rocky-bot-api.egordkd.workers.dev';
        const tg = window.Telegram.WebApp;

        // --- API ЛОГИКА ---
        async function loadUserProfile(chatId) {
            const url = `${API_URL}/api/profile?chat_id=${chatId}`;

            try {
                const response = await fetch(url, {
                    headers: {
                        'X-Telegram-Init-Data': tg.initData,
                        'Cache-Control': 'no-cache'
                    }
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    
                    // Если пользователь не зарегистрирован, перенаправляем на регистрацию
                    if (response.status === 404 && errorData.redirect === 'registration') {
                        window.location.href = '../registration/registration.html';
                        return;
                    }
                    
                    throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                return data || {};
            } catch (error) {
                console.error("Error loading user profile:", error);
                throw error;
            }
        }

        async function saveUserProfile(chatId, userData) {
            const url = `${API_URL}/api/profile`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'X-Telegram-Init-Data': tg.initData
                    },
                    body: JSON.stringify({
                        chat_id: chatId,
                        payment_info: userData.payment_info,
                        notes: userData.notes
                    })
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
                }
                
                return await response.json();
            } catch (error) {
                console.error("Error saving user profile:", error);
                throw error;
            }
        }

        // --- ЛОГИКА СТРАНИЦЫ ---
        document.addEventListener('DOMContentLoaded', async () => {
            tg.ready();
            tg.expand();

            // Инициализация элементов после загрузки DOM
            const form = document.getElementById('profileForm');
            const loadingEl = document.getElementById('loading');
            const errorEl = document.getElementById('error');

            // UI функции
            function showLoading(show) {
                loadingEl.style.display = show ? 'flex' : 'none';
                form.style.display = show ? 'none' : 'block';
            }

            function showError(message) {
                if (message) {
                    errorEl.textContent = message;
                    errorEl.style.display = 'block';
                } else {
                    errorEl.style.display = 'none';
                }
            }

            const user = tg.initDataUnsafe?.user;
            if (user) {
                // Обновляем заголовок с именем пользователя
                const userName = `${user.first_name || ''} ${user.last_name || ''}`.trim() || 'Пользователь';
                let displayUsername = user.username || 'Не указан';
                if (displayUsername !== 'Не указан') {
                    displayUsername = displayUsername.trim();
                    if (!displayUsername.startsWith('@')) {
                        displayUsername = '@' + displayUsername;
                    }
                }
                document.getElementById('userSummary').innerHTML = `${userName}<br>${displayUsername}`;
                
                // Заполняем поля информации
                document.getElementById('userId').textContent = user.id;
                document.getElementById('username').textContent = displayUsername;
                document.getElementById('firstName').textContent = user.first_name || 'Не указано';
                document.getElementById('lastName').textContent = user.last_name || 'Не указано';
                document.getElementById('phone').textContent = 'Не указан';
            }

            tg.MainButton.setText('💾 Сохранить изменения');
            tg.MainButton.show();

            showLoading(true);
            showError('');

            try {
                const userProfileData = await loadUserProfile(user.id);

                if (userProfileData && userProfileData.success && userProfileData.user) {
                    // Существующий пользователь с данными
                    const userData = userProfileData.user;
                    
                    // Отладочная информация
                    console.log('API Response:', userData);
                    
                    document.getElementById('payment').value = userData.payment_info || '';
                    document.getElementById('notes').value = userData.notes || '';
                    
                    // Обновляем отображение пользователя
                    document.getElementById('userId').textContent = userData.chat_id;
                    
                    // Исправляем отображение username - убираем двойные @@ и лишние пробелы
                    let displayUsername = userData.username || 'Не указан';
                    console.log('Original username from API:', JSON.stringify(userData.username));
                    if (displayUsername !== 'Не указан') {
                        // Убираем лишние пробелы и нормализуем
                        displayUsername = displayUsername.trim();
                        console.log('After trim:', JSON.stringify(displayUsername));
                        // Если уже есть @ в начале, используем как есть, иначе добавляем
                        if (!displayUsername.startsWith('@')) {
                            displayUsername = '@' + displayUsername;
                            console.log('Added @:', JSON.stringify(displayUsername));
                        } else {
                            console.log('Already starts with @:', JSON.stringify(displayUsername));
                        }
                    }
                    console.log('Final displayUsername:', JSON.stringify(displayUsername));
                    document.getElementById('username').textContent = displayUsername;
                    
                    // Обновляем заголовок с реальными данными
                    const userName = `${userData.first_name || ''} ${userData.last_name || ''}`.trim() || 'Пользователь';
                    document.getElementById('userSummary').innerHTML = `${userName}<br>${displayUsername}`;
                    
                    // Добавляем отображение новых полей
                    document.getElementById('firstName').textContent = userData.first_name || 'Не указано';
                    document.getElementById('lastName').textContent = userData.last_name || 'Не указано';
                    document.getElementById('phone').textContent = userData.phone || 'Не указан';
                }
                showLoading(false);
            } catch (error) {
                console.error(error);
                
                // Показываем сообщение об ошибке и скрываем форму
                const errorMessage = error.message || 'Не удалось загрузить данные профиля. Попробуйте позже.';
                showError(errorMessage);
                
                // Скрываем форму и кнопку при ошибке доступа
                loadingEl.style.display = 'none';
                form.style.display = 'none';
                tg.MainButton.hide();
            }
        });

        tg.MainButton.onClick(async () => {
            const form = document.getElementById('profileForm');
            const errorEl = document.getElementById('error');
            
            function showError(message) {
                if (message) {
                    errorEl.textContent = message;
                    errorEl.style.display = 'block';
                } else {
                    errorEl.style.display = 'none';
                }
            }

            tg.MainButton.showProgress();
            showError('');

            const userData = {
                payment_info: document.getElementById('payment').value,
                notes: document.getElementById('notes').value
            };

            try {
                const result = await saveUserProfile(tg.initDataUnsafe.user.id, userData);
                if (result && result.success) {
                    tg.showAlert('✅ Профиль успешно сохранен!', () => {
                        tg.close();
                    });
                } else {
                    throw new Error(result.message || "Save operation failed");
                }
            } catch (error) {
                console.error(error);
                showError('Не удалось сохранить данные. Попробуйте снова.');
            } finally {
                tg.MainButton.hideProgress();
            }
        });
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .user-summary {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
        }

        .widget {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
        }

        .widget h3 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #333;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
            font-family: inherit;
        }

        .hint {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 200px;
            color: white;
            font-size: 18px;
        }

        .error {
            background: #ff4757;
            color: white;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .info-label {
            font-weight: 600;
            color: #666;
        }

        .info-value {
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👤 Профиль пользователя</h1>
            <div class="user-summary" id="userSummary">Загрузка...</div>
        </div>
        
        <div id="loading" class="loading">
            🔄 Загрузка данных профиля...
        </div>

        <div id="error" class="error"></div>
        
        <form id="profileForm" style="display: none;">
            <!-- Основная информация -->
            <div class="widget">
                <h3>📋 Основная информация</h3>
                <div class="info-row">
                    <span class="info-label">ID:</span>
                    <span class="info-value" id="userId">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Имя:</span>
                    <span class="info-value" id="firstName">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Фамилия:</span>
                    <span class="info-value" id="lastName">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Username:</span>
                    <span class="info-value" id="username">-</span>
                </div>
                <div class="info-row">
                    <span class="info-label">Телефон:</span>
                    <span class="info-value" id="phone">-</span>
                </div>
            </div>

            <!-- Редактируемые поля -->
            <div class="widget">
                <h3>💳 Платежные реквизиты</h3>
                <div class="form-group">
                    <label for="payment">Реквизиты для оплаты:</label>
                    <textarea 
                        id="payment" 
                        name="payment" 
                        rows="4" 
                        placeholder="Укажите номер карты, банк и ФИО держателя карты"
                    ></textarea>
                    <div class="hint">Укажите реквизиты для получения оплаты</div>
                </div>
            </div>

            <div class="widget">
                <h3>📝 Дополнительная информация</h3>
                <div class="form-group">
                    <label for="notes">Заметки:</label>
                    <textarea 
                        id="notes" 
                        name="notes" 
                        rows="4" 
                        placeholder="Дополнительная информация о предпочтениях, графике работы и т.д."
                    ></textarea>
                    <div class="hint">Любая дополнительная информация о вас</div>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
